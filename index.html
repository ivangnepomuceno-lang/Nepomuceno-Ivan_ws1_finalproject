<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICCT Clubs</title>
  <noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
  <script>
    
    fetch('api/me.php', { credentials: 'same-origin' })
      .then(function (r) { return r.json() })
      .then(function (j) { window.location.replace(j && j.user ? 'home.html' : 'login.html') })
      .catch(function () { window.location.replace('login.html') })
  </script>
</head>
<body>
  <p>Redirecting... <a href="login.html">Click here</a> if nothing happens.</p>
</body>
</html>
