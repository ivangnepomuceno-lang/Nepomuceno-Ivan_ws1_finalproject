<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club</title>
  <link rel="stylesheet" href="clubs.css">
  <script src="clubs.js" defer></script>
  <script src="app.js" defer></script>
  <script src="membership.js" defer></script>
  <script src="announcements.js" defer></script>
  <script src="club.js" defer></script>
</head>
<body class="clubs-body club-page">
  <nav class="navbar">
    <a href="home.html" class="nav-brand">
      <img id="nav-logo" alt="">
      <span id="nav-name"></span>
    </a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="#about" id="nav-about">About</a>
      <a href="#members">Members</a>
      <a href="#activities">Activities</a>
      <a href="#announcement">Announcement</a>
    </div>
  </nav>

  <div class="back-wrap">
    <a href="home.html" class="back">&larr; Back to clubs</a>
  </div>

  <section class="hero">
    <img id="hero-logo" class="hero-logo" alt="">
    <h1 id="club-title"></h1>
    <p id="club-tagline"></p>
    <span class="member-badge" id="member-badge"></span>
  </section>

  <section class="block" id="about">
    <div class="members-head">
      <span class="eyebrow">Who we are</span>
      <h2 id="about-title">About</h2>
    </div>
    <p class="about-text" id="about-text"></p>
  </section>

  <section class="block" id="members">
    <div class="members-head">
      <span class="eyebrow">Meet the team</span>
      <h2 id="members-title">Members</h2>
      <p class="members-msg" id="members-msg"></p>
    </div>
    <div class="members-wrap" id="members-list"></div>
  </section>

  <section class="block" id="activities">
    <div class="members-head">
      <span class="eyebrow">What we do</span>
      <h2 id="activities-title">Activities</h2>
      <p class="members-msg" id="activities-msg"></p>
    </div>
    <div class="carousel">
      <button class="arrow" id="prev" aria-label="Previous">&#8592;</button>
      <div class="track" id="activity-track"></div>
      <button class="arrow" id="next" aria-label="Next">&#8594;</button>
    </div>
  </section>

  <section class="block" id="announcement">
    <div class="members-head">
      <span class="eyebrow">Latest updates</span>
      <h2 id="announcement-title">Announcement</h2>
      <p class="members-msg" id="announcement-msg"></p>
    </div>
    <div class="announce-wrap" id="announce-list"></div>
  </section>

  <footer class="site-footer">
    <p class="foot-club" id="foot-club"></p>
    <p>ICCT Colleges Foundation, Inc.</p>
    <p class="foot-links" id="foot-links"></p>
    <button type="button" class="leave-btn" id="leave-btn">Leave this club</button>
    <p class="foot-small">&copy; <span id="foot-year"></span> ICCT Clubs. All rights reserved.</p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">&#8592;</button>
    <img id="lb-img" alt="">
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next">&#8594;</button>
    <span class="lb-count" id="lb-count"></span>
  </div>
</body>
</html>
